<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>บัญชีขนมบ้านเพลง</title>
<meta name="description" content="บัญชีรายรับ-รายจ่ายของร้านขนมบ้านเพลง-พระแท่น">
<meta name="theme-color" content="#F2F4EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121914" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="บัญชีร้าน">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Mitr:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div id="gate"><div class="gcard"><p>กำลังเปิดบัญชี…</p></div></div>

<div id="app" hidden>
  <div class="wrap">
    <header class="top">
      <img class="logo" src="icons/icon-192.png" alt="" width="44" height="44">
      <div class="brand"><b id="shopName">ขนมบ้านเพลง-พระแท่น</b><span>บัญชีรายรับ-รายจ่าย</span></div>
      <button class="pill mute" id="sync" data-act="sync-info">กำลังเปิด</button>
      <button class="gear" data-act="settings">ตั้งค่า</button>
    </header>
    <main id="view"></main>
  </div>
  <nav class="tabbar" aria-label="เมนูหลัก"><div class="bar" id="tabgrid">
    <button class="tab" data-act="tab" data-tab="home" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"/></svg>ภาพรวม</button>
    <button class="tab" data-act="tab" data-tab="list"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>รายการ</button>
    <button class="tab" data-act="tab" data-tab="stock"><svg viewBox="0 0 24 24"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>สต็อก</button>
    <button class="tab" data-act="tab" data-tab="debt"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>ค้างชำระ</button>
    <button class="tab" data-act="tab" data-tab="report"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>รายงาน</button>
  </div></nav>
</div>

<button class="fab" id="fab" data-act="add" aria-label="บันทึกรายการใหม่" hidden>+</button>
<div class="sheet" id="sheet" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<noscript><p style="padding:16px">ต้องเปิด JavaScript เพื่อใช้งานแอปนี้</p></noscript>
</body>
</html>
